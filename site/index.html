// ---- the same scoring rules as scoring.py ----
const SNMG = 24000;
const CASH_START = 2 * SNMG;
const CASH_FULL = 25 * SNMG;
const OFFERS = { A: [3, 12, 3000000], B: [1.5, 6, 1000000], C: [0.5, 3, 100000] };

const clamp = v => Math.max(0, Math.min(100, v));
const cashScore = x => x <= CASH_START ? 0 : clamp(Math.log(x / CASH_START) / Math.log(CASH_FULL / CASH_START) * 100);
const billsScore = p => p === null ? 50 : Math.pow(p / 100, 2) * 100;
const restockScore = n => clamp(Math.sqrt(n / 8) * 100);
const tenureScore = m => clamp(Math.sqrt(m / 60) * 100);

function assess(cash, orders, bills, months) {
  const blended = 0.3 * cashScore(cash) + 0.3 * billsScore(bills) + 0.2 * restockScore(orders) + 0.2 * tenureScore(months);
  let score = Math.round(300 + blended * 5.5);
  if (months < 6) score = Math.min(score, 699);
  const tier = score >= 700 ? "A" : score >= 580 ? "B" : "C";
  const rule = OFFERS[tier];
  const amount = Math.round(Math.min(cash * rule[0], rule[2]) / 1000) * 1000;
  return { score: score, tier: tier, amount: amount, term: rule[1] };
}

let lang = "en";
const $ = id => document.getElementById(id);

function money(n) {
  const text = n.toLocaleString(lang === "fr" ? "fr-FR" : "en-US");
  return text + (lang === "ar" ? " دج" : " DA");
}

function update() {
  const cash = Math.max(0, parseFloat($("cash").value) || 0);
  const orders = Math.max(0, parseFloat($("orders").value) || 0);
  const months = Math.max(0, parseFloat($("months").value) || 0);
  const noBills = $("nobills").checked;
  const billsPct = Number($("bills").value);
  $("bills").disabled = noBills;
  $("billsVal").textContent = billsPct;

  const r = assess(cash, orders, noBills ? null : billsPct, months);
  const text = T[lang];

  $("out").dataset.tier = r.tier;
  $("score").textContent = r.score;
  $("barFill").style.width = ((r.score - 300) / 550 * 100) + "%";
  $("tierLabel").textContent = text.r_tier.replace("{t}", r.tier);
  $("tierDesc").textContent = text["d_" + r.tier];
  $("offer").textContent = text.r_offer.replace("{amount}", money(r.amount)).replace("{months}", r.term);

  const notes = [];
  if (months < 6) notes.push(text.fl_short);
  if (noBills) notes.push(text.fl_nobills);
  else if (billsPct < 70) notes.push(text.fl_late);
  if (orders <= 1) notes.push(text.fl_rare);
  $("flags").innerHTML = "";
  notes.forEach(function (note) {
    const li = document.createElement("li");
    li.textContent = note;
    $("flags").appendChild(li);
  });
}

function buildContactButtons() {
  const box = $("contactButtons");
  box.innerHTML = "";
  const links = [];
  if (CONTACT.emailUser) links.push(["mailto:" + CONTACT.emailUser + "@" + CONTACT.emailHost + "?subject=Mizan", "c_email"]);
  if (CONTACT.whatsapp) links.push(["https://wa.me/" + CONTACT.whatsapp, "c_whatsapp"]);
  if (CONTACT.telegram) links.push(["https://t.me/" + CONTACT.telegram, "c_telegram"]);
  links.forEach(function (item, index) {
    const a = document.createElement("a");
    a.className = index === 0 ? "btn" : "btn ghost";
    a.href = item[0];
    if (item[0].indexOf("http") === 0) { a.target = "_blank"; a.rel = "noopener"; }
    a.dataset.i18n = item[1];
    box.appendChild(a);
  });
  
}

function setLang(code) {
  lang = T[code] ? code : "en";
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.title = T[lang].title;
  document.querySelectorAll("[data-i18n]").forEach(function (el) {
    el.textContent = T[lang][el.dataset.i18n];
  });
  document.querySelectorAll(".langs button").forEach(function (b) {
    b.setAttribute("aria-pressed", b.dataset.lang === lang ? "true" : "false");
  });
  update();
}

function firstLanguage() {
  const fromUrl = new URLSearchParams(location.search).get("lang");
  if (fromUrl && T[fromUrl]) return fromUrl;
  const browser = (navigator.language || "en").slice(0, 2).toLowerCase();
  return T[browser] ? browser : "en";
}

document.querySelectorAll(".langs button").forEach(function (b) {
  b.addEventListener("click", function () { setLang(b.dataset.lang); });
});
["cash", "orders", "months", "bills", "nobills"].forEach(function (id) {
  $(id).addEventListener("input", update);
});

buildContactButtons();
setLang(firstLanguage());
</script>
